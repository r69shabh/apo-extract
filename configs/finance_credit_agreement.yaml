run_id: credit-srpbo-v1
seed: 42

dataset:
  name: finance/credit_agreement
  root_dir: data/extract-bench
  schema_path: data/extract-bench/dataset/finance/credit_agreement/credit_agreement-schema.json
  documents_glob: data/extract-bench/dataset/finance/credit_agreement/pdf+gold/*.pdf
  gold_dir: data/extract-bench/dataset/finance/credit_agreement/pdf+gold
  split_policy:
    seed: 42
    train_ratio: 0.30
    val_ratio: 0.40
    test_ratio: 0.30

scoring:
  engine: extract_bench_compliant          # or "your.module:factory"
  primary_metric: overall_micro_f1
  array_alignment_policy: hungarian_plus_llm_cache
  number_default_tolerance: 0.001
  semantic_match_threshold: 0.70
  judge_model: openrouter/google/gemini-2.5-flash-lite  # free-tier gemini daily caps exhausted; OR paid tier, same family
  enable_llm_judge: false
  cache_path: runs/cache/scoring_cache.sqlite

llms:
  extractor:
    provider: openrouter
    model: google/gemini-2.5-flash-lite  # gemini family; page-image PDF ingestion below
    temperature: 0.0
    pdf_mode: images
  optimizer_mutator:
    provider: openrouter
    model: google/gemini-2.5-flash-lite
    temperature: 1.0
  scoring_judge:
    provider: openrouter
    model: google/gemini-2.5-flash-lite
    temperature: 0.0

seed_prompt:
  path: configs/prompts/seed_generic_extraction.txt

budget:
  max_iterations: 12
  max_cost_usd: 15.0
  max_total_tokens: 4000000
  max_wall_clock_seconds: 3600

optimizer:
  strategy: subtree_pareto_beam
  beam_width: 3
  candidates_per_iteration: 2
  min_val_improvement: 0.005
  stage1_max_train_regression: 0.02
  pareto_aggregate_tolerance: 0.03
  stall_patience: 2
  duplicate_similarity: 0.92
  enable_subtree_rollback: true
  extraction_mode: single_call  # switch to subtree_chunked if prompts exceed context
  chunk_threshold_fields: 60
