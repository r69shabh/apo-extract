[project]
name = "apo-extract"
version = "0.1.0"
description = "Automated Prompt Optimization for Structured Extraction (ExtractBench)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "extract-bench",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "litellm>=1.0",
    "google-genai>=1.0",
    "scipy>=1.11",
    "pypdfium2>=4.0",
    "json-repair>=0.30",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apo_extract"]

[project.scripts]
apo-extract = "apo_extract.cli:main"

[tool.uv.sources]
extract-bench = { path = "data/extract-bench", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
